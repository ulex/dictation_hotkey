name: Build

on:
  push:
    branches: [main, master, macos]
    tags: ["v*"]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller dictation_hotkey.spec

      - uses: actions/upload-artifact@v4
        with:
          name: DictationHotkey
          path: dist/DictationHotkey.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/DictationHotkey.exe
          token: ${{ secrets.PUB_TOKEN }}

  build-macos:
    # macos-14 = Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build app bundle
        run: pyinstaller dictation_hotkey_macos.spec

      - name: Ad-hoc sign
        # Makes the bundle properly signed (locally) so Gatekeeper treats it
        # consistently on Apple Silicon. For real distribution, replace with a
        # Developer ID signature + notarization (see README).
        run: codesign --force --deep --sign - dist/DictationHotkey.app

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/DictationHotkey.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "Dictation Hotkey" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            "dist/DictationHotkey-macOS-AppleSilicon.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: DictationHotkey-macOS-AppleSilicon
          path: dist/DictationHotkey-macOS-AppleSilicon.dmg

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/DictationHotkey-macOS-AppleSilicon.dmg
          token: ${{ secrets.PUB_TOKEN }}

  build-linux-flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.dictationhotkey.DictationHotkey.yml
          bundle: DictationHotkey-Linux.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: DictationHotkey-Linux
          path: DictationHotkey-Linux.flatpak

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: DictationHotkey-Linux.flatpak
          token: ${{ secrets.PUB_TOKEN }}
