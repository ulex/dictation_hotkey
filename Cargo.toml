[package]
name = "dictation-hotkey-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native streaming dictation for Windows and macOS"

[dependencies]
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Media_Audio", "Win32_UI_HiDpi", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_System_LibraryLoader",
  "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemServices"
] }

windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Security", "Win32_UI_Shell", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
